name: Tapedeck
options:
  bundleIdPrefix: com.erikbiebinger
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Tapedeck:
    type: application
    platform: macOS
    sources:
      - path: Tapedeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erikbiebinger.tapedeck
        INFOPLIST_FILE: Tapedeck/Info.plist
        PRODUCT_NAME: "TAPEDECK"
        # Baked by `make build` from the repo this Makefile lives in; surfaces
        # in the bundle as the Info.plist key TDRepoRoot. Empty here so a bare
        # `xcodebuild` (no Makefile) falls through to AppPaths' fallback rather
        # than baking an empty string as truth.
        TD_REPO_ROOT: ""
